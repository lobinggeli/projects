<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Photos de l’annonce · Galatry 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F5F4; --sheet:#FBFCFB; --ink:#1B2530; --ink-2:#56626E; --rule:#C9D1D4;
  --room:#E6ECEE; --accent:#2F6690;
  --f-draw:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10161B; --sheet:#151D23; --ink:#DCE4E9; --ink-2:#93A1AB; --rule:#2B3740; --room:#1C262E; --accent:#7DB4E0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10161B; --sheet:#151D23; --ink:#DCE4E9; --ink-2:#93A1AB; --rule:#2B3740; --room:#1C262E; --accent:#7DB4E0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1,h2{font-family:var(--f-draw);font-weight:600;letter-spacing:.01em;margin:0}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05}
p{margin:0;max-width:68ch}
.muted{color:var(--ink-2)}
header{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:20px}
.kicker{font-family:var(--f-draw);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--accent)}
header a{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid button{all:unset;cursor:zoom-in;display:block;position:relative;background:var(--sheet);border:1px solid var(--rule);aspect-ratio:3/2;overflow:hidden}
.grid button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.grid button:hover img{transform:scale(1.03)}
.grid .n{position:absolute;left:6px;top:6px;font:500 12px/1 var(--f-mono);background:rgba(0,0,0,.55);color:#fff;padding:4px 6px;border-radius:2px}
.box{position:fixed;inset:0;z-index:1000;background:rgba(8,12,15,.94);display:none;align-items:center;justify-content:center}
.box.open{display:flex}
.box img{max-width:calc(100vw - 32px);max-height:calc(100vh - 96px);object-fit:contain}
.box .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;font:500 13px/1 var(--f-mono)}
.box button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:3px;font:600 15px/1 var(--f-draw);padding:10px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.box button:hover{background:rgba(255,255,255,.24)}
.box .prev,.box .next{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;padding:14px 16px}
.box .prev{left:12px}.box .next{right:12px}
.box .bar a{color:#fff}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">Chemin de Galatry 3 · Corseaux VD</div>
  <h1>Photos de l’annonce</h1>
  <p class="muted">Les 25 photos de l’annonce de vente publiée par <a href="https://www.rivieraproperties.ch/fr/o/a-vendre-maison-swiss-riviera-5926947" target="_blank" rel="noopener">Riviera Properties</a>, dans l’ordre de la galerie. Cliquer sur une photo pour l’agrandir, puis les flèches ← → pour passer à la suivante.</p>
</header>
<div class="grid" id="grid"></div>
</div>
<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <div class="bar"><span id="cap"></span><span><a id="full" href="#" target="_blank" rel="noopener">Original</a>&nbsp;&nbsp;<button type="button" id="close">✕</button></span></div>
  <button type="button" class="prev" id="prev" aria-label="Précédente">‹</button>
  <img id="big" alt="">
  <button type="button" class="next" id="next" aria-label="Suivante">›</button>
</div>
<script>
(function () {
  var N = 25, i = 0;
  var grid = document.getElementById("grid"), box = document.getElementById("box");
  var big = document.getElementById("big"), cap = document.getElementById("cap"), full = document.getElementById("full");
  function name(k) { return (k < 10 ? "0" : "") + k + ".jpg"; }
  for (var k = 0; k < N; k++) {
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Photo " + (k + 1) + " sur " + N);
    b.innerHTML = '<img loading="lazy" alt="Photo ' + (k + 1) + ' de l’annonce" src="annonce/thumbs/' + name(k) + '"><span class="n">' + (k + 1) + '</span>';
    b.addEventListener("click", (function (k) { return function () { show(k); }; })(k));
    grid.appendChild(b);
  }
  function show(k) {
    i = (k + N) % N;
    big.src = "annonce/" + name(i);
    big.alt = "Photo " + (i + 1) + " de l’annonce";
    full.href = big.src;
    cap.textContent = (i + 1) + " / " + N;
    box.classList.add("open");
  }
  function hide() { box.classList.remove("open"); }
  document.getElementById("close").onclick = hide;
  document.getElementById("prev").onclick = function () { show(i - 1); };
  document.getElementById("next").onclick = function () { show(i + 1); };
  box.addEventListener("click", function (e) { if (e.target === box) hide(); });
  document.addEventListener("keydown", function (e) {
    if (!box.classList.contains("open")) return;
    if (e.key === "Escape") hide();
    else if (e.key === "ArrowLeft") show(i - 1);
    else if (e.key === "ArrowRight") show(i + 1);
  });
})();
</script>
<script src="toc.js" defer></script>
</body>
</html>
